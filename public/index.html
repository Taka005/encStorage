<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セキュア・画像ビューアー</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
        .viewer-container {
            width: 100%;
            background-color: #ffffff;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .viewer-track {
            display: flex;
            align-items: center;
        }
        .viewer-track img {
            flex: 0 0 100%;
            width: 100%;
            height: 500px;
            object-fit: contain;
            scroll-snap-align: center;
            box-sizing: border-box;
            border: 1px solid #f0f0f0;
            padding: 10px;
        }
        .status { padding: 10px; text-align: center; color: #666; }
    </style>
</head>
<body>

<div id="status" class="status">初期化中...</div>

<div class="viewer-container">
    <div class="viewer-track" id="imageViewer">
    </div>
</div>
</script>
</body>
</html>
